<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12306b">
  <title>タブレット操作手順</title>
  <style>
    :root{color-scheme:light;--navy:#12306b;--ink:#152643;--surface:#f3f6fc;--line:#cdd8eb;--white:#fff;
      font-family:system-ui,-apple-system,"Segoe UI","Noto Sans",sans-serif}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;color:var(--ink);background:var(--surface);line-height:1.6}
    button,a{touch-action:manipulation}
    button{font:inherit;cursor:pointer}
    a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #2072bc;outline-offset:4px}
    .shell{width:min(100%,1060px);margin:auto;padding-inline:clamp(14px,4vw,40px)}
    header{background:var(--navy);color:var(--white);padding-block:10px}
    header .shell{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
    .brand{font-size:1rem;font-weight:750}
    .header-action{display:inline-flex;align-items:center;min-height:44px;padding:4px 10px;color:inherit;text-decoration:none;font-weight:700}
    main{padding-block:clamp(20px,5vw,48px)}
    h1{font-size:clamp(1.5rem,4.2vw,2.4rem);line-height:1.25;margin:0 0 14px}
    .language-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,178px),1fr));gap:12px;margin-top:24px}
    .language-options button{background:var(--white);color:var(--navy);border:1px solid var(--line);border-radius:12px;font-weight:750;min-height:68px;padding:8px 12px}
    .language-options button:hover{background:#e8f0fd}
    .toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;margin:0 0 18px}
    .toolbar button,.jump a{display:inline-flex;align-items:center;min-height:44px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;color:var(--navy);background:var(--white);font-weight:700;text-decoration:none}
    .jump{display:flex;gap:8px;flex-wrap:wrap}
    .hint{margin:0;color:#52627b}
    h2{font-size:1.25rem;margin:24px 0 10px}
    details{background:var(--white);border:1px solid var(--line);border-radius:10px;margin:8px 0;scroll-margin-top:16px}
    summary{cursor:pointer;color:var(--navy);font-weight:750;padding:13px 15px;min-height:50px;overflow-wrap:anywhere}
    details[open] summary{border-bottom:1px solid var(--line)}
    .steps{margin:0;padding:12px 16px 15px 40px}
    .steps li{padding-inline-start:3px;overflow-wrap:anywhere}
    .steps li+li{margin-top:10px}
    .steps li::marker{color:var(--navy);font-weight:750}
    .admin details{border-inline-start:4px solid #518390}
    .question{margin:16px 0 0;font-size:1.05rem}
    .question span{display:block}
    @media(max-width:420px){.steps{padding-inline-start:33px}.toolbar{gap:8px}}
  </style>
</head>
<body>
  <header><div class="shell">
    <span class="brand">Outline</span>
    <a id="back" class="header-action" href="./outline.html">‹ アウトラインへ戻る</a>
  </div></header>
  <main class="shell">
    <section id="choose" aria-labelledby="choose-title">
      <h1 id="choose-title" tabindex="-1">タブレット操作手順</h1>
      <p class="question">
        <span lang="ja">何語で手順を読みますか？</span>
        <span lang="id">Dalam bahasa apa Anda ingin membaca panduan ini?</span>
        <span lang="pt-BR">Em que idioma você quer ler o manual?</span>
        <span lang="vi">Bạn muốn đọc hướng dẫn bằng ngôn ngữ nào?</span>
      </p>
      <div class="language-options">
        <button type="button" data-language="ja" lang="ja">日本語</button>
        <button type="button" data-language="id" lang="id">Bahasa Indonesia</button>
        <button type="button" data-language="pt" lang="pt-BR">Português (Brasil)</button>
        <button type="button" data-language="vi" lang="vi">Tiếng Việt</button>
      </div>
    </section>
    <section id="manual" aria-labelledby="manual-title" hidden>
      <h1 id="manual-title" tabindex="-1"></h1>
      <div class="toolbar">
        <button id="change" type="button"></button>
        <nav class="jump" aria-labelledby="manual-title">
          <a id="operator-link" href="#operator"></a>
          <a id="admin-link" href="#admin"></a>
        </nav>
      </div>
      <p class="hint" id="hint"></p>
      <section aria-labelledby="operator" id="operator-sections"><h2 id="operator" tabindex="-1"></h2></section>
      <section class="admin" aria-labelledby="admin" id="admin-sections"><h2 id="admin" tabindex="-1"></h2></section>
    </section>
  </main>
  <script type="application/json" id="guide-data">{"ja":{"title":"タブレット操作手順","back":"アウトラインへ戻る","change":"言語を選び直す","operator":"作業者の手順","admin":"管理者の手順","open":"項目を押すと手順が開きます。","sections":[["立ち上げ・ログイン・言語",["タブレットの電源を入れ、Wi‑Fiにつながっていることを確認します。外付けQRリーダーを使う場合は、本体の電源とBluetooth接続も確認します。","ホーム画面の「アウトライン」を開きます。アイコンがない端末では、登録済みのブラウザーのブックマークから開きます。","ログイン画面が出たら、職場で指定されたメールアドレスとパスワードで「ログイン」します。工程一覧で自分の工程を選び、計画表の日付を確認します。","「製品揃え」と「小物掛け」では、画面上部の「言語」から日本語、Bahasa Indonesia、Português (Brasil)、Tiếng Việtを選べます。それ以外の工程では「JP」または「ID」を使います。"]],["製品・要領書を確認して作業開始",["計画表で次の作業の呼称、品番、指示箱数を確認し、「作業開始」を押します。担当者の選択画面が出たら自分の氏名を選び、「担当者を確定」を押します。","作業手順、写真、注意事項、目標箱数を確認します。必要なら「製品情報を見る」で、かんばん、納入箱、収容数などを開きます。","要領書の画面で担当者名を再確認し、「確認しました」にチェックして「作業開始」を押します。作業中の画面に進んだことを確認します。かんばんQRでの箱数登録は作業中に行います。","開始済みの作業を開き直すときは、計画表の該当行の「作業開始」を押し、続けて作業する担当者を選びます。同じ人が続けるときは、現在の担当者を選びます。当日の行が見当たらないときは、日付を確認して管理者に連絡します。"]],["1箱完了・かんばんQR照合",["QR照合対象の製品は、1箱が完了するたびに、その箱のかんばんQRを読みます。カメラの画面にかざすか、「外付けスキャナーを使う」を選び、「外付けスキャナー受付中」の表示を確認してからかざします。カメラ欄が見えない場合は「QR照合して1箱完了」で読み取り欄へ移動できます。","青○「一致」が出たら、完了箱数が1箱増えたことを確認し、QRを読み取り位置から外します。二度読み防止の待ち時間中は、正しいQRでも箱数は増えません。待ち時間が終わってから次の完了箱を読みます。","QR照合対象外で「1箱完了」が表示される製品は、1箱終わるたびに1回押します。誤登録を取り消す場合は「1つ戻す」を押し、箱数を確認します。"]],["赤×・読み取り異常・管理者解除",["赤×「不一致」や「管理者解除待ち」が出たら、その作業を止めて管理者を呼びます。箱、かんばん、画面の品番と表示内容を一緒に確認します。","管理者はロック画面の「管理者の解除用QRを読む」を選び、管理者用QRを読みます。解除で箱数は増えません。原因確認後、正しいかんばんQRを読み、完了箱数を確認します。","反応しないときは、作業中か、目標箱数に達していないか、待ち時間中かを確認します。外付けなら「受付中」とBluetooth、カメラなら選んだカメラと権限を確認し、直らなければ表示内容を管理者に伝えます。権限エラーや通信エラーが出たときは、画面の表示を残して管理者に伝えます。"]],["異常を記録する",["設備、材料、品違いの疑いなどの異常があれば、現場の指示に従って対処し、管理者に伝えます。アプリを操作できる状態で「⚠ 異常」を開きます。","該当する項目を選ぶか、何が起きたか、どの品番や箱に関係するか、取った対応をコメントに入力し、「記録する」を押します。"]],["不良数・作業者コメント",["「不良数（個）」には担当中に出た不良の合計を個数で入力します。不良がなければ0です。「作業者コメント」には不良の内容や気づいたこと、遅れた理由などを必要に応じて入力します。","途中で記録するときは「記録を保存」を押して結果を確認します。入力した不良数・コメントは「作業終了」でも保存されます。異常の記録は「⚠ 異常」から行います。"]],["休憩・ライン応援・担当者交代",["休憩に入るときは「休憩」、応援に行くときは「ライン応援」を押します。一時停止の表示を確認し、戻ったら「再開」を押します。","交代時は、それまでの完了箱数と不良数を確かめ、「担当者を変更」から次の人を選び「交代を確定」します。交代前の実績が保存され、新しい担当者の表示に切り替わります。"]],["作業終了・端数・次の作業",["完了箱数、不良数、コメントを確認して「■ OUT 作業終了」を押します。最後の箱が満数に達していない場合は「端数（個）」にその箱の個数を入れます。","「完了」を押し、作業完了の画面で完了箱数、端数、実働時間などを確認します。「次の作業へ」で計画表に戻り、次の作業を確認します。","製品を伴わない作業は、終了時に「作業終了」を押します。"]],["製品検索・画面を開き直す",["「製品検索」で呼称または品番などを入力し、対象を「選択」します。写真、形状、ハンガー、作業の流れ、納入箱、識別マーク、かんばん、端数品置き場所などを確認できます。","画面が閉じたときは、アウトラインを開き、同じ工程と日付の計画表で進行中の作業を探します。「↻ 更新」を使う場合は、先に入力中の記録を保存します。"]],["管理者ロック・担当者の登録",["工程を選び、計画表の「マスター」を押して管理者コードを入力します。「担当者管理」で氏名を入力し「追加」します。","計画表や作業開始画面の担当者一覧で、登録した氏名を選べることを確認します。"]],["製品マスター・写真・要領書・工数",["「マスター」で呼称や品番を検索し、必要なら工程で絞り込みます。新製品は新しい呼称を入力して「追加」し、その製品を開きます。","「基本情報」で実際の品番、品名、通る工程を登録します。製品写真、形状、ハンガー、必要道具、収容数、荷姿、納入箱、識別マーク、かんばん、端数品置き場所などを各項目に入れます。","「要領書・工数」で対象工程を選び、1箱工数（分）、収容数、写真つき手順、注意事項を入力します。手順や作業の流れを追加するときは前後の位置を確認します。","「保存する」を押し、作業者側で正しい工程に製品が出ることと、品番・写真・要領書が合っていることを確認します。"]],["QR照合設定・外付けリーダー",["製品マスターの「かんばん」で対象かんばんを開き、「このかんばんをQR照合に使う」にチェックします。「QR照合コード」に実際のQRに含まれる指定番号を先頭の0も含めて登録します。","「実物のQRを読んで設定を確認」で一致を確認し、保存します。「箱ごとに異なる番号を照合する」は、実物のQRに箱ごとの番号がある運用で設定します。","ALACRITY DIRECTを初めて接続するときは、機種の設定手順書に従ってBluetooth HIDでペア設定し、タブレットの「接続済み」を確認します。固定して使う端末は、指定された自動読み取り設定も確認します。","外付けだけ不一致になるときは、まずタブレットカメラと比較します。管理者が空白のテスト文書で入力文字を確認し、日本語変換や余分な文字が混じるときだけ、キーボードをEnglish (US)に切り替えて再確認します。"]],["スケジュール・履歴・評価・翻訳",["「スケジュール編集」で工程と日付を確認します。「製品の行」は呼称と数量（箱）、「作業の行」は作業名と所要時間（分）を入れて「行を追加」します。担当者の事前指定は任意です。","行の順番と日時を見直します。前日から複製するときはコピー元・先を確認します。始業・休憩時間を設定するときは「始業・休憩設定」を開きます。","「履歴」で完了箱数、開始・終了、不良数、コメントや異常を確認します。「評価」で対象期間や担当者を選びます。記録開始日や評価の調整は必要な場合に管理者が行います。","「製品揃え」と「小物掛け」で、マスターの「未翻訳をブラジルポルトガル語に翻訳」または「未翻訳をベトナム語に翻訳」を押すと不足分を一括保存できます。完了表示を確認し、作業者画面で対象言語を選んで読み直します。"]]]},"id":{"title":"Panduan penggunaan tablet","back":"Kembali ke Outline","change":"Pilih bahasa lain","operator":"Panduan operator","admin":"Panduan pengawas","open":"Ketuk judul bagian untuk membuka langkah-langkahnya.","sections":[["Menyalakan tablet, masuk, dan memilih bahasa",["Nyalakan tablet dan periksa koneksi Wi-Fi. Jika menggunakan pemindai QR eksternal, periksa daya dan koneksi Bluetooth pemindai.","Buka ikon Outline di layar utama. Jika ikon belum tersedia, buka aplikasi dari bookmark browser yang sudah disiapkan.","Jika layar masuk muncul, gunakan email dan kata sandi yang ditetapkan tempat kerja, lalu tekan Masuk. Pilih proses Anda dan periksa tanggal pada rencana kerja.","Pada proses Penyiapan Produk dan Penggantungan Part Kecil, pilih bahasa di bagian atas layar. Tersedia 日本語, Bahasa Indonesia, Português (Brasil), dan Tiếng Việt. Untuk proses lainnya gunakan JP atau ID."]],["Memeriksa produk dan petunjuk sebelum mulai",["Verifikasi nama referensi, kode produk, dan jumlah kotak pada baris pekerjaan berikutnya. Tekan Mulai Kerja. Jika diminta, pilih nama Anda dan konfirmasikan petugas.","Periksa petunjuk, foto, catatan perhatian, dan target kotak. Jika perlu, buka Lihat informasi produk untuk melihat kanban, kotak pengiriman, atau isi per kotak.","Periksa kembali nama petugas, centang bahwa Anda sudah memeriksa petunjuk, lalu tekan Mulai Kerja. Pastikan layar pekerjaan berjalan terbuka. Pencatatan kotak melalui QR dilakukan saat pekerjaan berlangsung.","Untuk membuka kembali tugas yang telah dimulai, tekan Mulai Kerja pada baris yang benar dan pilih petugas yang melanjutkan. Jika orangnya sama, pilih petugas saat ini. Jika baris tidak ditemukan, periksa tanggal dan hubungi pengawas."]],["Menyelesaikan satu kotak dan melakukan Pengecekan QR",["Untuk produk dengan Pengecekan QR, pindai kanban kotak tersebut setiap kali satu kotak selesai. Gunakan kamera tablet atau pilih pemindai eksternal dan tunggu status siap menerima pemindaian. Jika bagian kamera tidak terlihat, gunakan tombol Pengecekan QR untuk menyelesaikan satu kotak agar berpindah ke bagian pemindaian.","Saat tanda lingkaran biru menunjukkan Cocok, pastikan jumlah kotak bertambah satu, lalu jauhkan QR dari area pemindaian. Selama jeda pencegahan pindai ganda, QR yang benar pun belum menambah jumlah kotak. Tunggu hingga jeda selesai sebelum memindai kotak berikutnya.","Untuk produk tanpa Pengecekan QR, tekan tombol selesai satu kotak sekali per kotak jika tombolnya tersedia. Untuk membatalkan pencatatan yang keliru, tekan tombol kembali satu dan periksa jumlah kotak."]],["Tanda silang merah, masalah pemindaian, dan pembukaan kunci",["Jika muncul silang merah Tidak cocok atau status menunggu pengawas, hentikan pekerjaan tersebut dan panggil pengawas. Bandingkan kotak, kanban, kode produk di layar, dan pesan yang tampil.","Pengawas memilih menu untuk memindai QR pembuka kunci dan memindai QR khusus pengawas. Pembukaan kunci tidak menambah jumlah kotak. Setelah masalah diperiksa, pindai kanban yang benar dan periksa jumlah kotak.","Jika tidak ada respons, periksa apakah pekerjaan berjalan, target sudah tercapai, atau jeda pindai masih aktif. Untuk pemindai eksternal, periksa status siap dan Bluetooth. Untuk kamera, periksa pilihan kamera dan izinnya. Sampaikan pesan di layar kepada pengawas jika masalah berlanjut. Jika muncul galat izin atau jaringan, catat pesan tersebut dan beri tahu pengawas."]],["Mencatat kejadian abnormal",["Jika ada masalah pada peralatan, bahan, atau kemungkinan produk tertukar, ikuti aturan di lokasi dan beri tahu pengawas. Saat aplikasi dapat dioperasikan, buka menu ⚠ Abnormalitas (異常).","Pilih kategori yang sesuai atau tulis apa yang terjadi, produk atau kotak yang terkait, serta tindakan yang diambil. Tekan Catat (記録する)."]],["Jumlah produk cacat dan komentar operator",["Masukkan total produk cacat selama giliran Anda dalam satuan buah. Masukkan 0 bila tidak ada cacat. Isi komentar bila perlu, misalnya jenis cacat, hal yang diperhatikan, atau alasan keterlambatan.","Untuk menyimpan saat pekerjaan berlangsung, tekan Simpan catatan dan periksa hasilnya. Jumlah cacat dan komentar juga tersimpan pada saat pekerjaan diakhiri. Catat kejadian abnormal melalui menu ⚠ 異常."]],["Istirahat, bantuan lini, dan pergantian operator",["Tekan Istirahat ketika beristirahat atau Bantuan lini saat membantu lini. Pastikan status dijeda tampil dan tekan Lanjutkan saat kembali.","Sebelum serah terima, periksa jumlah kotak selesai dan produk cacat selama giliran Anda. Pilih Ganti petugas, pilih petugas berikutnya, lalu konfirmasikan. Hasil giliran sebelumnya tersimpan. Periksa nama petugas yang baru."]],["Mengakhiri pekerjaan dan mencatat kotak yang belum penuh",["Periksa jumlah kotak selesai, jumlah cacat, dan komentar. Tekan ■ OUT Selesai Kerja. Jika kotak terakhir belum penuh, masukkan jumlah unit di kolom sisa (端数（個）).","Tekan Selesai. Periksa jumlah kotak, sisa unit, dan waktu kerja pada layar hasil. Pilih pekerjaan berikutnya untuk kembali ke rencana kerja.","Untuk tugas tanpa produk, tekan Selesai Kerja saat tugas sudah selesai."]],["Mencari produk dan membuka kembali aplikasi",["Pada Pencarian Produk, masukkan nama referensi atau kode produk lalu pilih produk. Buka foto, bentuk, gantungan, urutan kerja, kotak pengiriman, tanda identifikasi, kanban, atau lokasi penyimpanan sisa.","Jika aplikasi tertutup, buka lagi dan cari pekerjaan yang masih berjalan pada proses dan tanggal yang sama. Simpan catatan yang sedang diisi sebelum menggunakan ↻ Perbarui."]],["Kunci pengawas dan pendaftaran petugas",["Pilih proses, buka Master (マスター), lalu masukkan kode pengawas. Buka Manajemen Petugas (担当者管理), masukkan nama, dan tekan Tambah.","Pastikan nama yang didaftarkan tersedia pada daftar petugas sebelum pekerjaan dimulai."]],["Master produk, foto, petunjuk, dan waktu standar",["Pada Master, cari nama referensi atau kode produk dan gunakan filter proses bila perlu. Untuk produk baru, masukkan nama referensi baru, tekan Tambah, lalu buka produknya.","Di Informasi dasar (基本情報), daftarkan kode, nama, dan proses yang dilalui produk. Tambahkan foto produk, bentuk, gantungan, alat, isi kotak, kemasan, kotak pengiriman, tanda identifikasi, kanban, dan lokasi sisa pada bagian masing-masing.","Pada Petunjuk kerja dan waktu (要領書・工数), pilih proses. Masukkan menit per kotak, isi per kotak, langkah dengan foto, dan catatan perhatian. Periksa urutan ketika menyisipkan langkah baru.","Tekan Simpan (保存する). Pada layar operator, periksa apakah produk muncul pada proses yang benar dan apakah kode, foto, dan petunjuk sesuai."]],["Pengaturan Pengecekan QR dan pemindai eksternal",["Buka Kanban pada master produk. Aktifkan Pengecekan QR untuk kanban yang sesuai, lalu masukkan kode yang terdapat pada QR, termasuk angka nol di depan.","Gunakan tombol uji dengan QR asli, periksa kecocokan, lalu simpan. Aktifkan pemeriksaan nomor unik per kotak bila QR fisik memang berisi nomor yang berbeda untuk setiap kotak.","Untuk pemasangan ALACRITY DIRECT pertama kali, ikuti panduan model untuk memasangkan Bluetooth HID dan pastikan tablet menunjukkan status terhubung. Untuk pemasangan tetap, periksa pengaturan pemindaian otomatis yang ditetapkan.","Jika hanya pemindai eksternal yang tidak cocok, bandingkan dengan kamera tablet. Pengawas dapat menguji hasil input pada dokumen kosong. Jika angka berubah atau muncul karakter tambahan, pilih tata letak papan ketik English (US) lalu uji lagi."]],["Jadwal, riwayat, evaluasi, dan terjemahan",["Pada Edit Jadwal (スケジュール編集), periksa proses dan tanggal. Isi nama referensi dan jumlah kotak pada baris produk. Untuk baris tugas, isi nama dan durasi dalam menit, lalu tekan Tambah baris. Penetapan petugas sebelumnya bersifat opsional.","Periksa urutan dan tanggal. Saat menyalin jadwal sebelumnya, periksa tanggal asal dan tujuan. Atur jam mulai dan istirahat pada 始業・休憩設定.","Pada Riwayat, lihat kotak selesai, waktu mulai dan berakhir, jumlah cacat, komentar, dan kejadian abnormal. Pada Evaluasi, pilih periode atau petugas. Pengawas mengatur tanggal awal pencatatan atau penyesuaian evaluasi bila diperlukan.","Untuk Penyiapan Produk dan Penggantungan Part Kecil, tombol terjemahan yang belum tersedia di Master mengisi bahasa Portugis Brasil atau Vietnam. Periksa pesan selesai dan baca hasil di layar operator dengan bahasa yang dipilih."]]]},"pt":{"title":"Manual de operação do tablet","back":"Voltar ao Outline","change":"Escolher outro idioma","operator":"Instruções para operadores","admin":"Instruções para supervisores","open":"Toque no título para abrir as instruções.","sections":[["Ligar o tablet, entrar e escolher o idioma",["Ligue o tablet e confira a conexão Wi-Fi. Se usar um leitor de QR externo, verifique também se ele está ligado e conectado por Bluetooth.","Abra o ícone do Outline na tela inicial. Se o ícone não estiver disponível, abra o aplicativo pelo favorito já cadastrado no navegador.","Se a tela de login aparecer, use o e-mail e a senha definidos para o trabalho e toque em Entrar. Selecione seu processo e confira a data no plano de trabalho.","Em Preparação de peças e Pendurar peças pequenas, use Idioma na parte superior da tela. As opções são 日本語, Bahasa Indonesia, Português (Brasil) e Tiếng Việt. Nos demais processos, use JP ou ID."]],["Conferir a peça e as instruções antes de iniciar",["No plano de trabalho, confira o nome de referência, o código da peça e a quantidade de caixas da próxima tarefa. Toque em Iniciar trabalho. Se solicitado, selecione seu nome e toque em Confirmar operador.","Confira as etapas, fotos, pontos de atenção e número de caixas previsto. Se precisar, abra Ver informações da peça para conferir o kanban, a caixa de entrega e a quantidade por caixa.","Confirme o nome do operador, marque a opção de confirmação e toque em Iniciar trabalho. Confira se a tela de trabalho em andamento abriu. O QR do kanban é lido durante o trabalho para registrar caixas.","Para reabrir uma tarefa já iniciada, toque em Iniciar trabalho na linha correspondente e selecione quem vai continuar. Se a mesma pessoa for continuar, selecione o operador atual. Se a linha não aparecer, confira a data e consulte o supervisor."]],["Concluir uma caixa e conferir o QR do kanban",["A cada caixa concluída de uma peça com conferência por QR, leia o kanban da própria caixa. Use a câmera do tablet ou selecione Usar scanner externo e aguarde a indicação de que o leitor está pronto. Se a câmera não estiver visível, toque em Conferir o QR para concluir 1 caixa para ir à área de leitura.","Quando aparecer o círculo azul de correspondência, confira se o total aumentou em uma caixa e retire o QR da área do leitor. Durante a espera contra leitura duplicada, um QR correto ainda não aumenta o total. Espere o fim desse intervalo para ler a próxima caixa concluída.","Se o produto não usa QR e o botão de conclusão de uma caixa está disponível, toque uma vez por caixa concluída. Se registrar uma caixa por engano, use o botão de voltar uma unidade e confira o total."]],["X vermelho, falha de leitura e desbloqueio",["Se aparecer um X vermelho por divergência ou a indicação de aguardar desbloqueio, interrompa essa tarefa e chame o supervisor. Confira a caixa, o kanban, o código da peça e a mensagem na tela.","O supervisor seleciona a leitura do QR de desbloqueio e apresenta seu QR. O desbloqueio não aumenta o total de caixas. Depois de verificar a causa, leia o kanban correto e confira o total.","Se não houver resposta, verifique se o trabalho está em andamento, se a meta já foi atingida e se há espera contra duplicidade. Confira o estado do leitor e o Bluetooth, ou a seleção e a permissão da câmera. Se o problema continuar, informe ao supervisor a mensagem da tela. Se houver erro de permissão ou de conexão, anote a mensagem e avise o supervisor."]],["Registrar uma ocorrência",["Se houver problema com equipamento, material ou suspeita de troca de peça, siga a orientação do local e avise o supervisor. Quando a tela estiver disponível, abra ⚠ Ocorrência (異常).","Selecione um motivo ou descreva o que ocorreu, o código ou a caixa afetada e o que foi feito. Toque em Registrar (記録する)."]],["Quantidade de peças com defeito e comentário",["Informe o total de peças com defeito durante seu período na tarefa, em unidades. Use 0 se não houve defeitos. Se precisar, registre o tipo de defeito, observações ou o motivo de um atraso no comentário do operador.","Para gravar durante a tarefa, toque em Salvar registro e confira o resultado. A quantidade de defeitos e o comentário também são gravados ao encerrar o trabalho. Use ⚠ 異常 para registrar uma ocorrência."]],["Pausa, apoio à linha e troca de operador",["Toque em Pausa ao sair para o intervalo ou em Apoio à linha ao prestar apoio. Confira se o trabalho está pausado e toque em Retomar ao voltar.","Antes da troca, confira as caixas concluídas e os defeitos do seu período. Toque em Trocar operador, selecione a próxima pessoa e confirme a troca. O sistema salva o resultado do período anterior. Confira o nome do novo operador."]],["Encerrar trabalho e registrar uma caixa parcial",["Confira as caixas concluídas, os defeitos e o comentário. Toque em ■ OUT Encerrar trabalho. Se a última caixa estiver incompleta, preencha Quantidade restante (端数（個）) com o número de peças dessa caixa.","Toque em Concluir. Confira caixas concluídas, peças restantes e tempo efetivo na tela de resultado. Volte ao plano pelo botão da próxima tarefa.","Para uma tarefa sem produto, toque em Encerrar trabalho ao terminar."]],["Buscar peças e reabrir a tela",["Em Buscar peças, digite o nome de referência ou o código da peça e toque em Selecionar. Abra as informações de foto, formato, suporte, sequência, caixa de entrega, identificação, kanban ou local para peças restantes.","Se a tela fechar, reabra o Outline e procure o trabalho em andamento no mesmo processo e na mesma data. Salve os registros em edição antes de usar ↻ Atualizar."]],["Bloqueio do supervisor e cadastro de operadores",["Selecione o processo, abra Cadastro (マスター) e digite o código de supervisor. Em Gerenciar operadores (担当者管理), informe o nome e toque em Adicionar.","Confira se o nome pode ser selecionado na lista de operadores ao preparar o trabalho."]],["Cadastro de peças, fotos, instruções e tempo padrão",["Em Cadastro, busque pelo nome de referência ou código e filtre por processo se necessário. Para uma peça nova, digite o novo nome de referência, toque em Adicionar e abra a ficha.","Em Dados básicos (基本情報), informe o código, o nome e os processos da peça. Preencha as abas de fotos, formato, suporte, ferramentas, quantidade por caixa, embalagem, caixa de entrega, marca, kanban e local para peças restantes.","Em Instruções e tempos (要領書・工数), selecione o processo e informe minutos por caixa, quantidade por caixa, etapas com fotos e pontos de atenção. Confira a ordem ao inserir uma etapa.","Toque em Salvar (保存する). Na tela do operador, confira se a peça aparece no processo correto e se código, foto e instruções estão corretos."]],["Configurar o QR do kanban e o leitor externo",["Na aba Kanban da ficha da peça, selecione o kanban e habilite a conferência por QR. Cadastre um código que esteja contido no QR real, incluindo os zeros à esquerda.","Use a opção de teste com o QR real, confira o resultado e salve. Ative a conferência por número único de caixa se o QR real tiver um número diferente para cada caixa.","Na primeira conexão do ALACRITY DIRECT, siga as instruções do modelo para parear por Bluetooth HID. Confira se o tablet indica que está conectado. Para um leitor fixo, confira também a configuração de leitura automática definida no local.","Se apenas o leitor externo indicar divergência, compare com a câmera do tablet. O supervisor pode verificar os caracteres recebidos em um documento em branco. Se houver conversões ou caracteres a mais, teste novamente com o teclado English (US)."]],["Programação, histórico, avaliação e tradução",["Em Editar programação (スケジュール編集), confira o processo e a data. Para uma linha de produto, digite a referência e o número de caixas. Para uma linha de tarefa, digite o nome e a duração em minutos. Toque em Adicionar linha. Indicar o operador antes é opcional.","Confira a ordem e a data. Ao copiar a programação anterior, confirme as datas de origem e destino. O horário de início e os intervalos são definidos em 始業・休憩設定.","Em Histórico, confira caixas concluídas, início e fim, defeitos, comentários e ocorrências. Em Avaliação, escolha o período ou operador. O supervisor pode ajustar a data inicial dos registros e a avaliação quando necessário.","Em Preparação de peças e Pendurar peças pequenas, os botões de tradução de itens pendentes no Cadastro completam o português do Brasil ou o vietnamita. Confira a mensagem de conclusão e revise o resultado no idioma correspondente na tela do operador."]]]},"vi":{"title":"Hướng dẫn sử dụng máy tính bảng","back":"Quay lại Outline","change":"Chọn lại ngôn ngữ","operator":"Hướng dẫn cho người thao tác","admin":"Hướng dẫn cho quản lý","open":"Chạm vào tiêu đề để mở các bước.","sections":[["Bật máy, đăng nhập và chọn ngôn ngữ",["Bật máy tính bảng và kiểm tra kết nối Wi-Fi. Nếu dùng máy quét QR ngoài, kiểm tra nguồn điện và kết nối Bluetooth của máy quét.","Mở biểu tượng Outline trên màn hình chính. Nếu chưa có biểu tượng, mở ứng dụng từ dấu trang đã lưu trên trình duyệt.","Khi màn hình đăng nhập hiện ra, dùng email và mật khẩu do nơi làm việc chỉ định rồi nhấn Đăng nhập. Chọn công đoạn của mình và kiểm tra ngày trên kế hoạch làm việc.","Ở công đoạn Chuẩn bị sản phẩm và Treo chi tiết nhỏ, chọn Ngôn ngữ ở đầu màn hình. Có các lựa chọn 日本語, Bahasa Indonesia, Português (Brasil) và Tiếng Việt. Với công đoạn khác, dùng JP hoặc ID."]],["Kiểm tra sản phẩm và hướng dẫn trước khi bắt đầu",["Trên kế hoạch làm việc, kiểm tra tên gọi, mã sản phẩm và số thùng của công việc tiếp theo, rồi nhấn Bắt đầu làm việc. Nếu có yêu cầu, chọn tên mình và nhấn Xác nhận người phụ trách.","Kiểm tra các bước, hình ảnh, điểm cần lưu ý và số thùng mục tiêu. Khi cần, mở Xem thông tin sản phẩm để kiểm tra kanban, thùng giao hàng và số chi tiết trong mỗi thùng.","Kiểm tra lại tên người phụ trách, đánh dấu đã kiểm tra và nhấn Bắt đầu làm việc. Xác nhận màn hình làm việc đang mở. Quét mã QR kanban để ghi nhận số thùng trong lúc làm việc.","Để mở lại công việc đã bắt đầu, nhấn Bắt đầu làm việc ở đúng dòng và chọn người tiếp tục. Nếu vẫn cùng một người làm, chọn người phụ trách hiện tại. Nếu không thấy dòng công việc, kiểm tra ngày và hỏi quản lý."]],["Hoàn thành một thùng và đối chiếu mã QR kanban",["Với sản phẩm cần đối chiếu QR, quét mã QR kanban của chính thùng đó mỗi khi hoàn thành một thùng. Dùng camera máy tính bảng hoặc chọn Dùng máy quét ngoài và chờ màn hình báo đang chờ quét. Nếu không thấy vùng camera, nhấn Đối chiếu mã QR để hoàn thành 1 thùng để chuyển đến vùng quét.","Khi hiện vòng tròn xanh báo khớp, kiểm tra số thùng đã tăng một rồi đưa mã QR ra khỏi vùng đọc. Trong thời gian chống quét trùng, mã đúng cũng chưa làm tăng số thùng. Chờ hết thời gian này rồi quét thùng tiếp theo đã hoàn thành.","Với sản phẩm không cần QR, nếu có nút hoàn thành một thùng thì nhấn một lần cho mỗi thùng. Nếu ghi nhận nhầm, dùng nút lùi một thùng và kiểm tra lại số đếm."]],["Dấu X đỏ, lỗi quét và mở khóa",["Nếu xuất hiện dấu X đỏ báo không khớp hoặc thông báo chờ quản lý mở khóa, dừng công việc đó và gọi quản lý. Cùng kiểm tra thùng, kanban, mã sản phẩm và thông báo trên màn hình.","Quản lý chọn mục quét mã QR mở khóa rồi quét mã dành cho quản lý. Mở khóa không làm tăng số thùng. Sau khi kiểm tra nguyên nhân, quét lại đúng mã QR kanban và kiểm tra số thùng.","Nếu máy không phản hồi, kiểm tra công việc có đang chạy, đã đủ số thùng mục tiêu hay đang trong thời gian chờ. Với máy quét ngoài, kiểm tra trạng thái chờ quét và Bluetooth. Với camera, kiểm tra camera đã chọn và quyền truy cập. Nếu vẫn lỗi, báo nội dung hiện trên màn hình cho quản lý. Nếu có lỗi quyền truy cập hoặc kết nối, ghi lại thông báo và báo quản lý."]],["Ghi nhận bất thường",["Nếu thiết bị, vật liệu có vấn đề hoặc nghi ngờ nhầm sản phẩm, làm theo hướng dẫn tại nơi làm việc và báo quản lý. Khi có thể thao tác trên ứng dụng, mở ⚠ Bất thường (異常).","Chọn mục phù hợp hoặc ghi rõ việc xảy ra, mã sản phẩm hoặc thùng liên quan, và cách xử lý. Nhấn Ghi nhận (記録する)."]],["Số lượng sản phẩm lỗi và ghi chú",["Nhập tổng số sản phẩm lỗi trong phần việc mình phụ trách, tính theo từng chiếc. Nếu không có lỗi, nhập 0. Khi cần, ghi loại lỗi, điều phát hiện hoặc lý do chậm tiến độ vào ô ghi chú.","Để lưu trong lúc làm việc, nhấn Lưu bản ghi và kiểm tra kết quả. Số lỗi và ghi chú cũng được lưu khi kết thúc công việc. Ghi nhận sự việc bất thường ở mục ⚠ 異常."]],["Nghỉ giải lao, hỗ trợ dây chuyền và bàn giao",["Khi nghỉ, nhấn Nghỉ giải lao. Khi đi hỗ trợ dây chuyền, nhấn Hỗ trợ dây chuyền. Kiểm tra trạng thái tạm dừng và nhấn Tiếp tục khi quay lại.","Trước khi bàn giao, kiểm tra số thùng đã hoàn thành và số sản phẩm lỗi của mình. Chọn Đổi người phụ trách, chọn người tiếp theo rồi xác nhận. Kết quả trước bàn giao được lưu. Kiểm tra tên người phụ trách mới."]],["Kết thúc công việc và ghi số lẻ",["Kiểm tra số thùng hoàn thành, số sản phẩm lỗi và ghi chú, rồi nhấn ■ OUT Kết thúc công việc. Nếu thùng cuối chưa đủ, nhập số chi tiết trong thùng đó vào ô Số lẻ (端数（個）).","Nhấn Hoàn thành. Kiểm tra số thùng, số chi tiết lẻ và thời gian làm việc thực tế trên màn hình kết quả. Nhấn nút công việc tiếp theo để quay về kế hoạch.","Với công việc không có sản phẩm, nhấn Kết thúc công việc khi làm xong."]],["Tìm sản phẩm và mở lại màn hình",["Ở mục Tìm sản phẩm, nhập tên gọi hoặc mã sản phẩm rồi nhấn Chọn. Mở các mục ảnh, hình dạng, giá treo, trình tự thao tác, thùng giao hàng, dấu nhận dạng, kanban hoặc nơi đặt sản phẩm lẻ.","Nếu màn hình bị đóng, mở lại Outline và tìm công việc đang làm ở cùng công đoạn và ngày. Lưu thông tin đang nhập trước khi dùng ↻ Cập nhật."]],["Khóa quản lý và đăng ký người phụ trách",["Chọn công đoạn, mở Danh mục (マスター) rồi nhập mã quản lý. Vào mục Quản lý người phụ trách (担当者管理), nhập tên và nhấn Thêm.","Kiểm tra xem đã chọn được tên mới trong danh sách người phụ trách trước khi bắt đầu làm việc hay chưa."]],["Danh mục sản phẩm, hình ảnh, hướng dẫn và thời gian chuẩn",["Trong Danh mục, tìm bằng tên gọi hoặc mã sản phẩm và lọc theo công đoạn nếu cần. Với sản phẩm mới, nhập tên gọi mới, nhấn Thêm rồi mở hồ sơ sản phẩm.","Ở mục Thông tin cơ bản (基本情報), nhập mã, tên và các công đoạn của sản phẩm. Lần lượt đăng ký ảnh sản phẩm, hình dạng, giá treo, dụng cụ, số lượng mỗi thùng, cách đóng gói, thùng giao hàng, dấu nhận dạng, kanban và nơi đặt sản phẩm lẻ.","Ở mục Hướng dẫn và thời gian (要領書・工数), chọn công đoạn rồi nhập số phút mỗi thùng, số lượng mỗi thùng, các bước kèm ảnh và phần lưu ý. Khi thêm bước, kiểm tra vị trí trước và sau.","Nhấn Lưu (保存する). Mở màn hình người thao tác để kiểm tra sản phẩm nằm đúng công đoạn và mã, ảnh, hướng dẫn trùng khớp."]],["Cài đặt QR kanban và máy quét ngoài",["Mở mục Kanban trong danh mục sản phẩm và bật đối chiếu QR cho đúng loại kanban. Đăng ký chuỗi mã có trong QR thực tế, kể cả các số 0 ở đầu.","Dùng chức năng thử với QR thực tế, kiểm tra kết quả khớp rồi lưu. Chỉ bật kiểm tra mã riêng theo từng thùng khi QR thực tế chứa số riêng của từng thùng.","Khi kết nối ALACRITY DIRECT lần đầu, làm theo hướng dẫn của mẫu máy để ghép nối Bluetooth HID, rồi kiểm tra trạng thái đã kết nối trên máy tính bảng. Nếu máy quét lắp cố định, kiểm tra cả chế độ tự động quét đã quy định.","Nếu chỉ máy quét ngoài báo không khớp, so sánh với camera máy tính bảng. Quản lý có thể thử dữ liệu quét trên một tài liệu trống. Nếu có ký tự bị chuyển đổi hoặc thừa, chuyển bố cục bàn phím sang English (US) và thử lại."]],["Lịch làm việc, lịch sử, đánh giá và bản dịch",["Trong Chỉnh sửa lịch (スケジュール編集), kiểm tra công đoạn và ngày. Với dòng sản phẩm, nhập tên gọi và số thùng. Với dòng công việc, nhập tên và số phút. Nhấn Thêm dòng. Có thể chọn trước người phụ trách nếu cần.","Kiểm tra thứ tự và ngày. Khi sao chép kế hoạch trước, kiểm tra ngày nguồn và ngày đích. Giờ bắt đầu và các khung nghỉ được đặt tại 始業・休憩設定.","Vào Lịch sử để kiểm tra số thùng hoàn thành, giờ bắt đầu và kết thúc, số lỗi, ghi chú và bất thường. Trong Đánh giá, chọn khoảng thời gian hoặc người phụ trách. Khi cần, quản lý đặt ngày bắt đầu ghi nhận hoặc điều chỉnh đánh giá.","Ở công đoạn Chuẩn bị sản phẩm và Treo chi tiết nhỏ, dùng nút bổ sung bản dịch tiếng Bồ Đào Nha Brazil hoặc tiếng Việt trong Danh mục. Kiểm tra thông báo hoàn tất, rồi chọn ngôn ngữ tương ứng trên màn hình người thao tác để đọc lại."]]]}}</script>
  <script>
    'use strict';

    const guide = JSON.parse(document.getElementById('guide-data').textContent);
    const element = id => document.getElementById(id);

    function appendSection(parent, title, steps, open) {
      const section = document.createElement('details');
      section.open = open;
      const heading = document.createElement('summary');
      heading.textContent = title;
      const list = document.createElement('ol');
      list.className = 'steps';
      for (const text of steps) {
        const item = document.createElement('li');
        item.textContent = text;
        list.append(item);
      }
      section.append(heading, list);
      parent.append(section);
    }

    function showGuide(language) {
      const content = guide[language];
      document.documentElement.lang = language === 'pt' ? 'pt-BR' : language;
      document.title = content.title;
      element('back').textContent = '‹ ' + content.back;
      element('manual-title').textContent = content.title;
      element('change').textContent = content.change;
      element('hint').textContent = content.open;

      const operator = element('operator');
      const admin = element('admin');
      operator.textContent = element('operator-link').textContent = content.operator;
      admin.textContent = element('admin-link').textContent = content.admin;
      element('operator-sections').replaceChildren(operator);
      element('admin-sections').replaceChildren(admin);

      content.sections.forEach(([title, steps], index) => {
        const group = index < 9 ? 'operator-sections' : 'admin-sections';
        appendSection(element(group), title, steps, index === 0);
      });
      element('choose').hidden = true;
      element('manual').hidden = false;
      element('manual-title').focus();
    }

    for (const button of document.querySelectorAll('[data-language]')) {
      button.addEventListener('click', () => showGuide(button.dataset.language));
    }

    element('change').addEventListener('click', () => {
      document.documentElement.lang = 'ja';
      document.title = guide.ja.title;
      element('back').textContent = '‹ ' + guide.ja.back;
      element('manual').hidden = true;
      element('choose').hidden = false;
      element('choose-title').focus();
    });
  </script>
</body>
</html>
