    if(order.status==='done')throw new Error('作業状態が変わりました。計画表を確認してください。');

    }

    const png=photoPng(src);png.catch(()=>{});

function usePhotoHold(action, identity) {
  const latest = useRef(action),press = useRef(null),timer = useRef(null),ignoreUntil = useRef(0);
  latest.current = action;
  function cancel() {clearTimeout(timer.current);timer.current = null;press.current = null;}
  useEffect(() => {
    const stop = () => {if (press.current) ignoreUntil.current = Date.now() + 900;cancel();};
    window.addEventListener('scroll', stop, true);window.addEventListener('blur', stop);document.addEventListener('visibilitychange', stop);
    return () => {cancel();window.removeEventListener('scroll', stop, true);window.removeEventListener('blur', stop);document.removeEventListener('visibilitychange', stop);};
  }, [identity]);
  function end(e) {
    const p = press.current;if (!p || e.pointerId !== p.id) return;
    if (p.fired) ignoreUntil.current = Date.now() + 900;
    cancel();
  }
  return {
    handlers: {
      onPointerDown: (e) => {
        if (e.isPrimary === false) {if (press.current) ignoreUntil.current = Date.now() + 900;cancel();return;}
        if (!latest.current || e.button !== 0) return;
        cancel();const p = { id: e.pointerId, x: e.clientX, y: e.clientY, fired: false };press.current = p;
        timer.current = setTimeout(() => {
          if (press.current !== p || !latest.current) return;
          p.fired = true;ignoreUntil.current = Date.now() + 1500;latest.current();
        }, 650);
      },
      onPointerMove: (e) => {const p = press.current;if (p && p.id === e.pointerId && Math.hypot(e.clientX - p.x, e.clientY - p.y) > 10) {ignoreUntil.current = Date.now() + 900;cancel();}},
      onPointerUp: end, onPointerCancel: () => cancel(), onPointerLeave: () => cancel(), onLostPointerCapture: () => cancel(),
      onContextMenu: (e) => {if (latest.current) {e.preventDefault();e.stopPropagation();}},
      onDragStart: (e) => {if (latest.current) {e.preventDefault();cancel();}}
    },
    consumeClick: (e) => {if (Date.now() < ignoreUntil.current) {e.preventDefault();e.stopPropagation();return true;}return false;}
  };
}

/* ══════════ 自動翻訳（JP→ID）：生産計画アプリと同じプロキシ ══════════ */
const TRANSLATE_URL = 'https://dawn-wave-20e6.motsu922.workers.dev';
async function translateText(text) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  try {
    const r = await fetch(TRANSLATE_URL + '?text=' + encodeURIComponent(text), {
      signal: controller.signal
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return j.translated || '';
  } finally {
    clearTimeout(timer);
  }
}
/* 翻訳が必要な箇所を収集（_src＝翻訳元の日本語。日本語が変わった項目だけ再翻訳。手入力の _id は尊重） */
function trStr(obj, key, jobs, force) {
  if (!obj) return;
  const jp = (obj[key] || '').trim();
  if (!jp) {
    delete obj[key + '_id'];
    delete obj[key + '_src'];
    return;
  }
  if (!force && obj[key + '_id'] && (obj[key + '_src'] === undefined || obj[key + '_src'] === jp)) {
    obj[key + '_src'] = jp;
    return;
  }
  jobs.push({
    jp,
    apply: (id) => {
      obj[key + '_id'] = id;
      obj[key + '_src'] = jp;
    }
  });
}
function trArr(obj, key, jobs, force) {
  if (!obj) return;
  const a = Array.isArray(obj[key]) ? obj[key] : [];
  if (!a.length) {
    delete obj[key + '_id'];
    delete obj[key + '_src'];
    return;
  }
  const ids = Array.isArray(obj[key + '_id']) ? obj[key + '_id'] : [];
  const srcs = Array.isArray(obj[key + '_src']) ? obj[key + '_src'] : [];
  const nid = a.map((jp, i) => !force && ids[i] && srcs[i] === jp ? ids[i] : null);
  obj[key + '_id'] = nid;
  obj[key + '_src'] = a.slice();
  a.forEach((jp, i) => {
    if (nid[i] == null && jp.trim()) jobs.push({
      jp,
      apply: (id) => {
        nid[i] = id;
      }
    });
  });
}
function collectTranslateJobs(d, force) {
  const jobs = [];
  const S = (o, k) => trStr(o, k, jobs, force),
    A = (o, k) => trArr(o, k, jobs, force);
  S(d, 'name');
  S(d, 'locNote');
  A(d, 'productNotes');
  A(d, 'cautions');
  A(d, 'toolNotes');
  A(d, 'kanbanNotes');
  if (d.shape) {
    (d.shape.points || []).forEach((p) => S(p, 'text'));
    (d.shape.similars || []).forEach((x) => {
      S(x, 'name');
      A(x, 'diffs');
    });
    A(d.shape, 'notes');
  }
  if (d.teekin) S(d.teekin, 'note');
  if (d.hanger) {
    (d.hanger.features || []).forEach((f) => {
      S(f, 'title');
      S(f, 'note');
    });
    (d.hanger.spec || []).forEach((r) => {
      S(r, 'k');
      S(r, 'v');
    });
    A(d.hanger, 'cautions');
  }
  (d.steps || []).forEach((x) => S(x, 'text'));
  (d.tools || []).forEach((x) => {
    S(x, 'name');
    S(x, 'note');
  });
  if (d.packing) {
    (d.packing.patterns || []).forEach((x) => {
      S(x, 'divider');
      S(x, 'direction');
    });
    A(d.packing, 'notes');
  }
  (d.boxes || []).forEach((bx) => {
    ['name', 'size', 'dividers', 'material'].forEach((k) => S(bx, k));
    (bx.steps || []).forEach((x) => {
      S(x, 'title');
      S(x, 'desc');
    });
  });
  if (d.idMark) {
    S(d.idMark, 'fullNote');
    S(d.idMark, 'zoomNote');
    S(d.idMark, 'markType');
  }
  (d.kanbans || []).forEach((k) => ['type', 'use', 'process', 'issuer', 'note', 'size'].forEach((f) => S(k, f)));
  Object.values(d.sheets || {}).forEach((sh) => {
    (sh.steps || []).forEach((x) => S(x, 'text'));

  });

}
async function runTranslate(jobs, onProgress) {
  let done = 0,
    fail = 0;
  const queue = jobs.slice();
  async function worker() {
    while (queue.length) {
      const j = queue.shift();
      try {
        const id = await translateText(j.jp);
        if (id) j.apply(id);else fail++;
      } catch (e) {
        fail++;
      }
      done++;
      onProgress && onProgress(done, jobs.length);
    }
  }
  await Promise.all([0, 1, 2, 3].map(worker));
  return {
    done,
    fail
  };
}

    function draw() {

      setZoom((window.QRious ? canvas : ref.current).toDataURL('image/png'));

// Pair legacy photo slots with the same numbered explanation, without compacting gaps.
function shapePointItems(shape = {}) {
  const points = Array.isArray(shape.points) ? shape.points : [];
  const photos = shape.pointPhotosPaired ? [] : [shape.img, shape.img2, shape.img3];
  let length = points.length;
  photos.forEach((photo, i) => { if (photo) length = Math.max(length, i + 1); });
  return Array.from({ length }, (_, i) => ({
    ...(points[i] || {}),
    img: Object.prototype.hasOwnProperty.call(points[i] || {}, 'img') ? points[i].img || '' : photos[i] || ''
  }));
}

function MasterAdmin({
  master,
  workers,
  user,
  onBack
}) {
  const {
    t,
    b
  } = useLang();
  const [sel, setSel] = useState(null);
  const [showWorkers, setShowWorkers] = useState(false);
  const [newH, setNewH] = useState('');
  const [q, setQ] = useState('');
  const modalOpen = !!sel || showWorkers;
  // 編集中はページ全体も固定する。一覧内の位置は overflow の切替で保持する。
  useEffect(() => {
    if (!modalOpen) return;
    const elements = [document.documentElement, document.body];
    const previous = elements.map((el) => ({
      el,
      overflow: el.style.overflow
    }));
    elements.forEach((el) => {
      el.style.overflow = 'hidden';
    });
    return () => previous.forEach(({
      el,
      overflow
    }) => {
      el.style.overflow = overflow;
    });
  }, [modalOpen]);
  const list = Object.keys(master).sort().filter((h) => matchHinban(master, h, q.trim().toLowerCase()));
  async function add() {
    const h = newH.trim();
    if (!h) return;
    if (master[h]) {
      showBiDialog("alert", 'すでに登録されています');
      return;
    }
    try {
      await db.collection('outlineMaster').doc(h).set({
        createdAt: new Date().toISOString().slice(0, 10)
      }, {
        merge: true
      });
      setNewH('');
      setSel(h);
    } catch (e) {
      showBiDialog("alert", '追加に失敗: ' + e.message);
    }
  }
  return <div className="app-screen master-screen" style={{
    height: '100vh',
    display: 'flex',
    flexDirection: 'column'
  }}>
      <div className="master-list-layout" inert={modalOpen ? '' : undefined} style={{
      flex: 1,
      minHeight: 0,
      display: 'flex',
      flexDirection: 'column'
    }}>
      <TopBar title={b('マスター管理')} onBack={onBack} user={user} />

        flex: 1,
        minHeight: 0,
        overflowY: modalOpen ? 'hidden' : 'auto',
        overscrollBehavior: 'contain',
        padding: '20px 28px'
      }}>
        <div className="master-admin-toolbar" style={{
          display: 'grid',
          gridTemplateColumns: 'minmax(180px,1fr) auto minmax(160px,260px) auto',
          gap: 12,
          marginBottom: 16,
          maxWidth: 1100
        }}>
          <LocalizedInput value={newH} onChange={(e) => setNewH(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && add()} placeholder="新しい呼称を追加..." />
          <button onClick={add} disabled={!newH.trim()} style={{
            minHeight: 46,

          <LocalizedInput value={q} onChange={(e) => setQ(e.target.value)} placeholder="呼称・品番で絞り込み..." style={{
            maxWidth: 260
          }} />
          <button onClick={() => setShowWorkers(true)} style={{
            minHeight: 46,
            padding: '0 18px',
            borderRadius: 8,

          }}><BiText value={"\uD83D\uDC64 \u62C5\u5F53\u8005\u7BA1\u7406"} /></button>
        </div>
        <BiText value={list.length === 0 && <div style={{
          padding: '40px',

          fontSize: 14
        }}><BiText value={"\u547C\u79F0\u304C\u767B\u9332\u3055\u308C\u3066\u3044\u307E\u305B\u3093\u3002"} /></div>} />

          updatedAt: stamp

          merge: true

/* 文章量と表示幅に合わせて、すべての複数行入力欄の高さを調整する。 */
function AutoTextarea({
  style,
  onInput,
  ...props
}) {
  const element = useRef(null);
  function fit() {
    const el = element.current;
    if (!el || !el.getClientRects().length) return;
    const css = getComputedStyle(el);
    const border = (parseFloat(css.borderTopWidth) || 0) + (parseFloat(css.borderBottomWidth) || 0);
    el.style.height = '0px';
    el.style.height = Math.ceil(el.scrollHeight + border) + 'px';
  }
  React.useLayoutEffect(() => {
    fit();
  });
  useEffect(() => {
    const el = element.current;
    let width = -1;
    const observer = typeof ResizeObserver === 'undefined' ? null : new ResizeObserver(() => {
      const next = el.getBoundingClientRect().width;
      if (next !== width) {
        width = next;
        fit();
      }
    });
    if (observer) observer.observe(el);
    window.addEventListener('resize', fit);
    let active = true;
    if (document.fonts) document.fonts.ready.then(() => {
      if (active) fit();
    });
    return () => {
      active = false;
      if (observer) observer.disconnect();
      window.removeEventListener('resize', fit);
    };
  }, []);
  return <textarea {...props} ref={element} onInput={(e) => {
    fit();
    if (onInput) onInput(e);
  }} style={{
    ...style,
    height: 'auto',
    minHeight: style && style.minHeight || 50,
    resize: 'none',
    overflowY: 'hidden',
    boxSizing: 'border-box',
    whiteSpace: 'pre-wrap',
    overflowWrap: 'anywhere'
  }} />;
}

/* 入力中の改行・空白は保持し、保存用の手順データだけを整形する。 */
function BoxStepsArea({
  value,
  onChange
}) {
  const format = (steps) => (steps || []).map((s) => `${s.title || ''}：${s.desc || ''}`).join('\n');
  const formatted = format(value);
  const [draft, setDraft] = useState(formatted);
  const emitted = useRef(formatted);
  useEffect(() => {
    if (formatted !== emitted.current) {
      emitted.current = formatted;
      setDraft(formatted);
    }
  }, [formatted]);
  function edit(text) {
    setDraft(text);
    const steps = text.split(/\r?\n/).filter((line) => line.trim()).map((line, i) => {
      const p = line.indexOf('：') >= 0 ? line.indexOf('：') : line.indexOf(':');
      return {
        ...((value || [])[i] || {}),
        title: (p < 0 ? line : line.slice(0, p)).trim(),
        desc: p < 0 ? '' : line.slice(p + 1).trim()
      };
    });
    emitted.current = format(steps);
    onChange(steps);
  }
  return <LocalizedArea value={draft} onChange={(e) => edit(e.target.value)} style={{
    width: '100%',
    height: 90,
    resize: 'vertical'
  }} />;
}

/* ══════════ 作業指示（Phase 2） ══════════ */
function pad2(n) {
  return String(n).padStart(2, '0');
}
function fmtHM(d) {
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtHMS(d) {
  return fmtHM(d) + ':' + pad2(d.getSeconds());
}
function fmtDur(ms) {
  const m = Math.max(0, Math.floor(ms / 60000));
  const h = Math.floor(m / 60);
  return (h ? h + 'h ' : '') + m % 60 + 'm';
}
function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function daysAgoKey(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
/* ── 始業・休憩設定と時間割計算 ── */
const DEFAULT_SETTINGS = {
  startTime: '08:10',
  breaks: [{
    label: '休憩1',
    from: '10:00',
    to: '10:20'
  }, {
    label: '昼休憩',
    from: '12:00',
    to: '12:45'
  }, {
    label: '休憩2',
    from: '15:00',
    to: '15:20'
  }]
};
function hm2min(x) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(x || '').trim());
  return m ? +m[1] * 60 + +m[2] : 0;
}
function min2hm(m) {
  m = Math.max(0, Math.round(m));
  return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
}
/* start(分)から dur(分) 作業したときの終了時刻(分)。休憩帯はまたいで後ろ倒し */
function addWork(start, dur, breaks) {
  const bs = (breaks || []).map((b) => ({
    f: hm2min(b.from),
    t: hm2min(b.to)
  })).filter((b) => b.t > b.f).sort((a, b) => a.f - b.f);
  let t = start,
    remain = Math.max(0, dur);
  for (const b of bs) {
    if (t >= b.f && t < b.t) t = b.t;
  }
  if (remain <= 0) return t;
  while (remain > 0) {
    const nb = bs.find((b) => b.f > t);
    const avail = nb ? nb.f - t : Infinity;
    if (remain <= avail) {
      t += remain;
      remain = 0;
    } else {
      remain -= avail;
      t = nb.t;
    }
  }
  return t;
}
/* 行の予定所要（分）：製品行＝1箱工数×箱数／作業行＝所要時間 */
function rowPlanMin(o) {
  if (o && o.kind === 'task') return Number(o.durMin) || 0;
  return (Number(o && o.kosu) || 0) * (Number(o && o.targetBoxes) || 0);
}
/* 計画行に _planStart/_planEnd/_planMin を付与して返す */
function buildTimeline(rows, settings) {
  const st = settings || DEFAULT_SETTINGS;
  let cur = hm2min(st.startTime || '08:00');
  return rows.map((o) => {
    const dur = rowPlanMin(o);
    const a = addWork(cur, 0, st.breaks); /* 休憩中なら明けへ */
    const e = addWork(a, dur, st.breaks);
    cur = e;
    return {
      ...o,
      _planMin: dur,
      _planStart: a,
      _planEnd: e
    };
  });
}

/* ── 評価・集計 ── */
/* 調整後の先行遅れ（分）。管理者が異常などで補正した分を加算 */
function effDiff(o) {
  return (Number(o && o.diffMin) || 0) + (Number(o && o.adjustMin) || 0);
}
function ymKey(d) {
  return String(d || '').slice(0, 7);
}
function yKey(d) {
  return String(d || '').slice(0, 4);
}
function shiftDate(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function shiftMonth(n) {
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}
/* 期間モードごとのバケット（新しい順→古い順に並べ替えて返す） */
function buildBuckets(mode) {
  const out = [];
  if (mode === 'day') {
    for (let i = 13; i >= 0; i--) out.push({
      key: shiftDate(-i),
      label: shiftDate(-i).slice(5)
    });
  } else if (mode === 'month') {
    for (let i = 11; i >= 0; i--) {
      const k = shiftMonth(-i);
      out.push({
        key: k,
        label: k.slice(2)
      });
    }
  } else {
    const y = new Date().getFullYear();
    for (let i = 4; i >= 0; i--) out.push({
      key: String(y - i),
      label: String(y - i)
    });
  }
  return out;
}
function bucketOf(o, mode) {
  return mode === 'day' ? String(o.date || '') : mode === 'month' ? ymKey(o.date) : yKey(o.date);
}
function summarize(list) {
  return list.reduce((a, o) => {
    a.n++;
    a.boxes += Number(o.doneBoxes) || 0;
    a.target += Number(o.targetBoxes) || 0;
    a.std += Number(o.stdMin) || 0;
    a.act += Number(o.actMin) || 0;
    a.diff += effDiff(o);
    a.anom += (o.anomalies || []).length;
    a.adj += Number(o.adjustMin) || 0;
    return a;
  }, {
    n: 0,
    boxes: 0,
    target: 0,
    std: 0,
    act: 0,
    diff: 0,
    anom: 0,
    adj: 0
  });
}

/* ── 棒グラフ（先行+は緑／遅れ−は赤） ── */
function DiffBarChart({
  buckets,
  values,
  unit
}) {
  const W = Math.max(360, buckets.length * 62),
    H = 200,
    pad = 26;
  const max = Math.max(1, ...values.map((v) => Math.abs(v)));
  const zero = H / 2;
  const bw = (W - pad * 2) / Math.max(1, buckets.length);
  return <div style={{
    overflowX: 'auto'
  }}>
      <svg width={W} height={H + 28} style={{
      display: 'block'
    }}>
        <line x1={pad} y1={zero} x2={W - pad} y2={zero} stroke="#C7CDD6" strokeWidth="1" />
        {buckets.map((b, i) => {
        const v = values[i] || 0;
        const h = Math.abs(v) / max * (H / 2 - 16);
        const x = pad + i * bw + bw * 0.2,
          w = bw * 0.6;
        const y = v >= 0 ? zero - h : zero;
        return <g key={b.key}>
              <rect x={x} y={y} width={w} height={Math.max(h, v === 0 ? 0 : 1)} rx="3" fill={v >= 0 ? '#2E7D4F' : '#C2410C'} />
              {v !== 0 && <text x={x + w / 2} y={v >= 0 ? y - 4 : y + h + 13} textAnchor="middle" fontSize="11" fontWeight="700" fill={v >= 0 ? '#1B5E20' : '#B71C1C'}>
                {(v > 0 ? '+' : '') + Math.round(v)}
              </text>}
              <text x={x + w / 2} y={H + 16} textAnchor="middle" fontSize="11" fill="#6B7480">{b.label}</text>
            </g>;
      })}
      </svg>
      <div style={{
      fontSize: 11,
      color: '#8A93A0',
      marginTop: 2
    }}><BiText value={"\u2191 \u5148\u884C\uFF08"} /><BiText value={unit} /><BiText value={"\uFF09\u3000\u2193 \u9045\u308C\uFF08"} /><BiText value={unit} />）</div>
    </div>;
}

/* 先行・遅れ計算 */
function calcLog(log, now) {
  const start = log.startAt || now,
    end = log.endAt || now;
  let paused = 0,
    cur = null;
  (log.pauses || []).forEach((p) => {
    if (p.to) {
      paused += p.to - p.from;
    } else {
      cur = p;
      paused += end - p.from;
    }
  });
  const elapsed = Math.max(0, end - start),
    active = Math.max(0, elapsed - paused);
  const cap = Number(log.capacity) || 0,
    kosu = Number(log.kosu) || 0;
  const fracBox = cap ? (Number(log.fraction) || 0) / cap : 0;
  const doneEq = (Number(log.doneBoxes) || 0) + fracBox;
  const stdMin = kosu * doneEq,
    actMin = active / 60000,
    diffMin = stdMin - actMin;
  const target = Number(log.targetBoxes) || 0;
  const remainMin = Math.max(0, kosu * (target - doneEq));
  return {
    elapsed,
    paused,
    active,
    stdMin,
    actMin,
    diffMin,
    remainMin,
    eta: new Date(end + remainMin * 60000),
    cur,
    doneEq,
    hasKosu: kosu > 0
  };
}
function useNow() {
  const [n, setN] = useState(Date.now());
  useEffect(() => {
    const id = setInterval(() => setN(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);
  return n;
}

/* ── スケジュール編集（管理者） ── */
function SchedulePlanner({
  proc,
  master,
  workers,
  orders,
  settings,
  user,
  onBack
}) {
  const {
    lang,
    t,
    b
  } = useLang();
  const [date, setDate] = useState(todayKey());
  const [busy, setBusy] = useState(false);
  const [addH, setAddH] = useState('');
  const [addQty, setAddQty] = useState('');
  const [addW, setAddW] = useState('');
  const [pick, setPick] = useState(false);
  const [mode, setMode] = useState('item'); /* item=製品の行 / task=作業の行 */
  const [addTask, setAddTask] = useState('');
  const [addDur, setAddDur] = useState('');
  const [shiftOpen, setShiftOpen] = useState(false);
  const wlist = Object.values(workers || {}).sort((a, b) => (a.order || 0) - (b.order || 0));
  const raw = Object.values(orders || {}).filter((o) => o.procId === proc.id && o.date === date).sort((a, b) => (a.order || 0) - (b.order || 0));
  const rows = buildTimeline(raw, settings);
  const col = db.collection('workOrders');
  async function run(fn) {
    if (busy) return;
    setBusy(true);
    try {
      await fn();
    } catch (e) {
      showBiDialog("alert", '更新に失敗: ' + e.message);
    } finally {
      setBusy(false);
    }
  }
  async function add() {
    const h = addH.trim();
    const q = parseInt(addQty, 10) || 0;
    if (!h || q <= 0) {
      showBiDialog("alert", '品番と数量を入力してください');
      return;
    }
    const m = master[h] || {};
    const w = wlist.find((x) => x.id === addW) || null;
    await run(() => col.add({
      date,
      procId: proc.id,
      procName: proc.ja,
      order: (rows.length ? Math.max(...rows.map((r) => r.order || 0)) : 0) + 10,
      hinban: h,
      hinbanName: m.name || '',
      partNo: m.partNo || '',
      targetBoxes: q,
      kosu: Number(m.sheets?.[proc.id]?.kosu) || 0,
      capacity: capacityOf(m, proc.id),
      assignedWorkerId: w ? w.id : null,
      assignedWorkerName: w ? w.name : '',
      workerId: null,
      workerName: '',
      status: 'pending',
      startAt: null,
      endAt: null,
      doneBoxes: 0,
      fraction: 0,
      pauses: [],
      anomalies: [],
      createdBy: user?.email || ''
    }));
    setAddQty('');
  }
  async function addTaskRow() {
    const nm = addTask.trim();
    const dmin = parseInt(addDur, 10) || 0;
    if (!nm || dmin <= 0) {
      showBiDialog("alert", '作業名と所要時間を入力してください');
      return;
    }
    const w = wlist.find((x) => x.id === addW) || null;
    await run(() => col.add({
      date,
      procId: proc.id,
      procName: proc.ja,
      order: (rows.length ? Math.max(...rows.map((r) => r.order || 0)) : 0) + 10,
      kind: 'task',
      taskName: nm,
      durMin: dmin,
      hinban: '',
      hinbanName: '',
      partNo: '',
      targetBoxes: 0,
      kosu: 0,
      capacity: 0,
      assignedWorkerId: w ? w.id : null,
      assignedWorkerName: w ? w.name : '',
      workerId: null,
      workerName: '',
      status: 'pending',
      startAt: null,
      endAt: null,
      doneBoxes: 0,
      fraction: 0,
      pauses: [],
      anomalies: [],
      createdBy: user?.email || ''
    }));
    setAddTask('');
    setAddDur('');
  }
  async function move(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= rows.length) return;
    const a = rows[i],
      bb = rows[j];
    await run(async () => {
      await col.doc(a.id).update({
        order: bb.order || 0
      });
      await col.doc(bb.id).update({
        order: a.order || 0
      });
    });
  }
  async function del(o) {
    if (o.status !== 'pending' && !(await showBiDialog("confirm", '開始済みの行です。削除すると実績も消えます。よろしいですか？'))) return;
    if (o.status === 'pending' && !(await showBiDialog("confirm", `${o.hinban} の行を削除しますか？`))) return;
    await run(() => col.doc(o.id).delete());
  }
  async function setQty(o, v) {
    const q = parseInt(v, 10) || 0;
    if (q <= 0) return;
    await run(() => col.doc(o.id).update({
      targetBoxes: q
    }));
  }
  async function setAssign(o, id) {
    const w = wlist.find((x) => x.id === id) || null;
    await run(() => col.doc(o.id).update({
      assignedWorkerId: w ? w.id : null,
      assignedWorkerName: w ? w.name : ''
    }));
  }
  async function copyFrom() {
    const src = await showBiDialog("prompt", 'コピー元の日付（YYYY-MM-DD）', daysAgoKey(1));
    if (!src) return;
    const srcRows = Object.values(orders || {}).filter((o) => o.procId === proc.id && o.date === src).sort((a, b) => (a.order || 0) - (b.order || 0));
    if (!srcRows.length) {
      showBiDialog("alert", src + ' の計画がありません');
      return;
    }
    if (!(await showBiDialog("confirm", `${src} の ${srcRows.length} 行を ${date} に複製しますか？`))) return;
    await run(async () => {
      let n = (rows.length ? Math.max(...rows.map((r) => r.order || 0)) : 0) + 10;
      for (const o of srcRows) {
        await col.add({
          date,
          procId: proc.id,
          procName: proc.ja,
          order: n,
          kind: o.kind || 'item',
          taskName: o.taskName || '',
          durMin: o.durMin || 0,
          hinban: o.hinban,
          hinbanName: o.hinbanName || '',
          partNo: o.partNo || '',
          targetBoxes: o.targetBoxes,
          kosu: o.kosu || 0,
          capacity: o.capacity || 0,
          assignedWorkerId: o.assignedWorkerId || null,
          assignedWorkerName: o.assignedWorkerName || '',
          workerId: null,
          workerName: '',
          status: 'pending',
          startAt: null,
          endAt: null,
          doneBoxes: 0,
          fraction: 0,
          pauses: [],
          anomalies: [],
          createdBy: user?.email || ''
        });
        n += 10;
      }
    });
  }
  const planMin = rows.reduce((a, o) => a + o._planMin, 0);
  const th = {
    padding: '7px 8px',
    fontSize: 12,
    fontWeight: 700,
    color: '#fff',
    textAlign: 'left',
    whiteSpace: 'normal',
    verticalAlign: 'bottom'
  };
  const td = {
    padding: '7px 8px',
    fontSize: 13.5,
    borderBottom: '1px solid ' + LINE,
    whiteSpace: 'normal'
  };
  return <div className="app-screen planner-screen" style={{
    height: '100vh',
    display: 'flex',
    flexDirection: 'column'
  }}>
      <TopBar title={b('スケジュール編集')} onBack={onBack} user={user} left={<div style={{
      color: '#fff',
      fontSize: 14,
      fontWeight: 600,
      overflow: 'hidden',
      textOverflow: 'ellipsis',
      whiteSpace: 'normal'
    }}>🏭 <BiText value={proc.ja} /></div>} />
      <div style={{
      flex: 1,
      overflowY: 'auto',
      padding: '16px 24px'
    }}>
        <div style={{
        display: 'flex',
        gap: 12,
        alignItems: 'flex-end',
        flexWrap: 'wrap',
        marginBottom: 14
      }}>
          <div><div style={{
            fontSize: 12,
            fontWeight: 700,
            color: '#4A5460',
            marginBottom: 5
          }}><BiText value={b('日付')} /></div>
            <LocalizedInput type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{
            width: 172,
            fontSize: 15
          }} /></div>
          <div style={{
          display: 'flex',
          gap: 0,
          alignSelf: 'flex-end',
          borderRadius: 8,
          overflow: 'hidden',
          border: '1px solid ' + LINE
        }}>
            <BiText value={[['item', b('製品の行')], ['task', b('作業の行')]].map(([k, lb]) => <button key={k} onClick={() => setMode(k)} style={{
            minHeight: 46,
            padding: '0 14px',
            fontSize: 13,
            fontWeight: 700,
            background: mode === k ? NAVY : '#fff',
            color: mode === k ? '#fff' : '#4A5460',
            whiteSpace: 'normal'
          }}><BiText value={lb} /></button>)} />
          </div>
          <BiText value={mode === 'task' ? <>
            <div style={{
            flex: 1,
            minWidth: 200
          }}><div style={{
              fontSize: 12,
              fontWeight: 700,
              color: '#4A5460',
              marginBottom: 5
            }}><BiText value={b('作業名')} /></div>
              <LocalizedInput value={addTask} onChange={(e) => setAddTask(e.target.value)} placeholder="例: ハンガーマン / 清掃" translateValue={true} /></div>
            <div><div style={{
              fontSize: 12,
              fontWeight: 700,
              color: '#4A5460',
              marginBottom: 5
            }}><BiText value={b('所要時間')} />（<BiText value={t('分')} />）</div>
              <LocalizedInput type="number" min="1" value={addDur} onChange={(e) => setAddDur(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addTaskRow()} placeholder="例: 30" style={{

          <div style={{

              <BiText value={addH ? <>
                <span style={{

  const taskDiff = taskPlanMin - c.active / 60000;
  /* 今日・同一工程の完了分の累計（リザルトに表示） */
  const todaySum = summarize(Object.values(orders || {}).filter((o) => o.status === 'done' && o.procId === proc.id && o.date === log.date));
  const paused = log.status === 'paused';
  const ref = db.collection('workOrders').doc(log.id);
  async function w(fn) {
    if (busy||qrGate.busy||qrGate.flash) return;if(qrBlocked){document.getElementById('workrun-camera')?.scrollIntoView({block:'nearest',behavior:'smooth'});return;}
    setBusy(true);
    try {
      await fn();
    } catch (e) {
      showBiDialog("alert", '更新に失敗: ' + e.message);
    } finally {
      setBusy(false);
    }
  }
  const addBox = () => needsQr ? document.getElementById('workrun-camera')?.scrollIntoView({block:'nearest',behavior:'smooth'}) : w(() => ref.update({
    doneBoxes: (log.doneBoxes || 0) + 1
  }));
  const undoBox = () => needsQr ? w(()=>undoVerifiedKanban(log.id)) : w(() => ref.update({
    doneBoxes: Math.max(0, (log.doneBoxes || 0) - 1)
  }));
  const pause = (type) => w(() => ref.update({
    status: 'paused',
    pauses: [...(log.pauses || []), {
      type,
      from: Date.now()
    }]
  }));
  const resume = () => w(() => {
    const ps = [...(log.pauses || [])];
    const last = ps[ps.length - 1];
    if (last && !last.to) ps[ps.length - 1] = {
      ...last,
      to: Date.now()
    };
    return ref.update({
      status: 'running',
      pauses: ps
    });
  });
  const addAnom = (comment) => w(() => ref.update({
    anomalies: [...(log.anomalies || []), {
      at: Date.now(),
      comment
    }]
  }));
  async function finish(fraction) {
    let res = null;
    await w(async () => {
      const ps = [...(log.pauses || [])];
      const last = ps[ps.length - 1];
      const end = Date.now();
      if (last && !last.to) ps[ps.length - 1] = {
        ...last,
        to: end
      };
      const snap = calcLog({
        ...log,
        pauses: ps,
        fraction,
        endAt: end
      }, end);
      const std = isTask ? taskPlanMin : snap.stdMin;
      const payload = {
        status: 'done',
        endAt: end,
        pauses: ps,
        fraction,
        stdMin: Math.round(std * 10) / 10,
        actMin: Math.round(snap.actMin * 10) / 10,
        diffMin: Math.round((std - snap.actMin) * 10) / 10,
        pausedMin: Math.round(snap.paused / 600) / 100
      };
      await ref.update(payload);
      res = {
        title: isTask ? '🔧 ' + (log.taskName || '作業') : log.hinban + '　' + (dv(m, 'name', lang) || ''),
        isTask,
        doneBoxes: log.doneBoxes || 0,
        targetBoxes: log.targetBoxes || 0,
        fraction: Number(fraction) || 0,
        stdMin: payload.stdMin,
        actMin: payload.actMin,
        diffMin: payload.diffMin,
        pausedMin: payload.pausedMin,
        startAt: log.startAt || end,
        endAt: end,
        anomCount: (log.anomalies || []).length
      };
    });
    setOut(false);
    if (res) setResult(res);else onDone();
  }

    target = log.targetBoxes || 0;

  const [mode, setMode] = useState('day');
  const [allProc, setAllProc] = useState(false);
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState('');
  const buckets = buildBuckets(mode);
  const from = buckets[0].key + (mode === 'day' ? '' : mode === 'month' ? '-01' : '-01-01');
  const to = buckets[buckets.length - 1].key + (mode === 'day' ? '' : mode === 'month' ? '-31' : '-12-31');
  useEffect(() => {
    let dead = false;
    setRows(null);
    setErr('');
    (async () => {
      try {
        const snap = await db.collection('workOrders').where('date', '>=', from).where('date', '<=', to).get();
        const list = [];
        (snap.docs || []).forEach((d) => list.push({
          id: d.id,
          ...d.data()
        }));
        if (!dead) setRows(list);
      } catch (e) {
        if (!dead) setErr(e.message);
      }
    })();
    return () => {
      dead = true;
    };
  }, [from, to]);
  const done = (rows || []).filter((o) => o.status === 'done' && (allProc || o.procId === proc.id));
  const sum = summarize(done);
  const values = buckets.map((bk) => summarize(done.filter((o) => bucketOf(o, mode) === bk.key)).diff);
  const boxesPer = buckets.map((bk) => summarize(done.filter((o) => bucketOf(o, mode) === bk.key)).boxes);
  const rate = sum.target ? Math.round(sum.boxes / sum.target * 100) : 0;
  function groupBy(keyFn, labelFn) {
    const m = {};
    done.forEach((o) => {
      const k = keyFn(o) || '—';
      (m[k] = m[k] || []).push(o);
    });
    return Object.entries(m).map(([k, v]) => ({
      key: k,
      label: labelFn ? labelFn(k, v) : k,
      ...summarize(v)
    })).sort((a, b) => b.boxes - a.boxes);
  }
  const byWorker = groupBy((o) => o.workerName || t('担当者なし'));
  const byItem = groupBy((o) => o.kind === 'task' ? '🔧 ' + (o.taskName || '作業') : o.hinban);
  const card = (k, v, col) => <div key={k} style={{
    padding: '12px 14px',
    background: '#fff',
    border: '1px solid ' + LINE,
    borderRadius: 10
  }}>
      <div style={{
      fontSize: 11,
      color: '#6B7480'
    }}><BiText value={k} /></div>
      <div style={{
      fontSize: 24,
      fontWeight: 800,
      color: col || NAVY
    }}><BiText value={v} /></div>
    </div>;
  const th = {
    padding: '9px 12px',
    fontSize: 12.5,
    fontWeight: 700,
    color: '#fff',
    textAlign: 'left',
    whiteSpace: 'normal'
  };
  const td = {
    padding: '9px 12px',
    fontSize: 13.5,
    borderBottom: '1px solid ' + LINE,
    whiteSpace: 'normal'
  };
  const tbl = (title, list) => <div style={{
    flex: '1 1 360px',
    minWidth: 320
  }}>
      <div style={{
      fontSize: 13,
      fontWeight: 700,
      color: BLUE,
      marginBottom: 6
    }}><BiText value={title} /></div>
      <div style={{
      border: '1px solid ' + LINE,
      borderRadius: 10,
      overflowX: 'auto',
      background: '#fff'
    }}>
        <table style={{
        width: '100%',
        borderCollapse: 'collapse'
      }}>
          <thead><tr style={{
            background: NAVY
          }}>
            <th style={th}>　</th><th style={{
              ...th,
              width: 70
            }}><BiText value={b('件')} /></th><th style={{
              ...th,
              width: 90
            }}><BiText value={b('箱')} /></th>
            <th style={{
              ...th,
              width: 100
            }}><BiText value={b('先行')} />/<BiText value={b('遅れ')} /></th><th style={{
              ...th,
              width: 70
            }}>⚠</th>
          </tr></thead>
          <tbody>
            <BiText value={list.map((r, i) => <tr key={r.key} style={{
            background: i % 2 ? '#F7F9FC' : '#fff'
          }}>
                <td style={{
              ...td,
              fontWeight: 700
            }}><BiText value={r.label} /></td>
                <td style={td}><BiText value={r.n} /></td>
                <td style={td}><BiText value={r.boxes} /></td>
                <td style={{
              ...td,
              fontWeight: 800,
              color: r.diff >= 0 ? '#1B5E20' : '#B71C1C'
            }}><BiText value={(r.diff >= 0 ? '+' : '−') + Math.abs(Math.round(r.diff))} /></td>
                <td style={{
              ...td,
              color: r.anom ? '#B71C1C' : '#C7CDD6'
            }}><BiText value={r.anom || '—'} /></td>
              </tr>)} />
            <BiText value={list.length === 0 && <tr><td colSpan={5} style={{
              ...td,
              textAlign: 'center',
              color: '#9AA3AF',
              padding: '24px'
            }}><BiText value={t('データがありません')} /></td></tr>} />
          </tbody>
        </table>
      </div>
    </div>;
  return <div className="app-screen analytics-screen" style={{
    height: '100vh',
    display: 'flex',
    flexDirection: 'column'
  }}>
      <TopBar title={b('評価')} onBack={onBack} user={user} left={<div style={{
      color: '#fff',
      fontSize: 14,
      fontWeight: 600,
      overflow: 'hidden',
      textOverflow: 'ellipsis',
      whiteSpace: 'normal'
    }}>🏭 <BiText value={proc.ja} /></div>} />
      <div style={{
      flex: 1,
      overflowY: 'auto',
      padding: '16px 24px'
    }}>
        <div style={{
        display: 'flex',
        gap: 10,
        alignItems: 'center',
        flexWrap: 'wrap',
        marginBottom: 14
      }}>
          <div style={{
          display: 'flex',
          borderRadius: 8,
          overflow: 'hidden',
          border: '1px solid ' + LINE
        }}>
            <BiText value={[['day', b('日')], ['month', b('月')], ['year', b('年')]].map(([k, lb]) => <button key={k} onClick={() => setMode(k)} style={{
            minHeight: 44,
            padding: '0 20px',
            fontSize: 14,
            fontWeight: 700,
            background: mode === k ? NAVY : '#fff',
            color: mode === k ? '#fff' : '#4A5460',
            whiteSpace: 'normal'
          }}><BiText value={lb} /></button>)} />
          </div>
          <button onClick={() => setAllProc((a) => !a)} style={{
          minHeight: 44,
          padding: '0 16px',
          borderRadius: 8,
          border: '1px solid ' + (allProc ? NAVY : LINE),
          background: allProc ? NAVY : '#fff',
          color: allProc ? '#fff' : '#4A5460',
          fontSize: 13.5,
          fontWeight: 700,
          whiteSpace: 'normal'
        }}>
            <BiText value={allProc ? '✓ ' : ''} /><BiText value={t('全工程')} />
          </button>
          <div style={{
          fontSize: 12.5,
          color: '#6B7480'
        }}><BiText value={from} /> 〜 <BiText value={to} /></div>
        </div>

        <BiText value={err && <div style={{
        padding: '12px 16px',
        background: '#FDECEA',
        color: '#B71C1C',
        borderRadius: 10,
        fontSize: 13,
        marginBottom: 14
      }}><BiText value={err} /></div>} />
        <BiText value={rows === null && !err && <div style={{
        padding: '40px',
        textAlign: 'center',
        color: '#9AA3AF'
      }}><BiText value={t('読込中...')} /></div>} />

        <BiText value={rows !== null && <>
          <div className="responsive-grid" style={{
          display: 'grid',
          gridTemplateColumns: 'repeat(auto-fit,minmax(135px,1fr))',
          gap: 10,
          marginBottom: 16
        }}>
            <BiText value={card(b('完了') + ' ' + b('件'), sum.n)} />
            <BiText value={card(b('完了箱数'), sum.boxes + ' / ' + sum.target)} />
            <BiText value={card(b('達成率'), rate + '%', rate >= 100 ? '#1B5E20' : NAVY)} />
            <BiText value={card(b('標準'), Math.round(sum.std) + t('分'), '#3A4552')} />
            <BiText value={card(b('実働'), Math.round(sum.act) + t('分'), '#3A4552')} />
            <BiText value={card(b('先行') + '/' + b('遅れ'), (sum.diff >= 0 ? '+' : '−') + Math.abs(Math.round(sum.diff)) + t('分'), sum.diff >= 0 ? '#1B5E20' : '#B71C1C')} />
            <BiText value={card(b('異常'), sum.anom, sum.anom ? '#B71C1C' : '#C7CDD6')} />
          </div>

          <div className="panel" style={{
          marginBottom: 16
        }}>
            <div className="panel-h">📊 <BiText value={b('先行')} />/<BiText value={b('遅れ')} /> <BiText value={b('推移')} />（<BiText value={t('分')} />）</div>
            <div style={{
            padding: 14
          }}><DiffBarChart buckets={buckets} values={values} unit={t('分')} /></div>
          </div>
          <div className="panel" style={{
          marginBottom: 16
        }}>
            <div className="panel-h">📦 <BiText value={b('完了箱数')} /> <BiText value={b('推移')} /></div>

            padding: 14,
            display: 'flex',
            alignItems: 'flex-end',
            gap: 6,
            overflowX: 'auto',
            minHeight: 140
          }}>
              <BiText value={buckets.map((bk, i) => {
              const mx = Math.max(1, ...boxesPer);
              return <div key={bk.key} style={{
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                gap: 4,
                minWidth: 48

                    <div style={{
                  fontSize: 11,
                  fontWeight: 700,
                  color: NAVY

                    <div style={{
                  width: 26,
                  height: Math.round((boxesPer[i] || 0) / mx * 90),
                  background: NAVY,
                  borderRadius: '4px 4px 0 0',
                  minHeight: boxesPer[i] ? 2 : 0
                }} />
                    <div style={{
                  fontSize: 11,
                  color: '#6B7480'
                }}><BiText value={bk.label} /></div>
                  </div>;
            })} />
            </div>
          </div>
          <div style={{
          display: 'flex',
          gap: 16,
          flexWrap: 'wrap'
        }}>
            <BiText value={tbl('👤 ' + b('担当者別'), byWorker)} />
            <BiText value={tbl('📦 ' + b('製品別'), byItem)} />
          </div>
        </>} />
      </div>
      <FooterBar left={<FBtn onClick={onBack}>‹ <BiText value={b('計画表')} /></FBtn>} />
    </div>;
}

/* ── 履歴（直近7日） ── */
function WorkHistory({
  proc,
  logs,
  user,
  onBack
}) {
  const {
    lang,
    t,
    b
  } = useLang();
  const [all, setAll] = useState(false);
  const [adj, setAdj] = useState(null);
  const list = Object.values(logs || {}).filter((l) => l.status === 'done' && (all || l.procId === proc.id)).sort((a, b) => (b.endAt || 0) - (a.endAt || 0));
  const th = {
    padding: '7px 8px',
    fontSize: 12,
    fontWeight: 700,
    color: '#fff',
    textAlign: 'left',
    whiteSpace: 'normal',
    verticalAlign: 'bottom'
  };
  const td = {
    padding: '8px 8px',
    fontSize: 13.5,
    borderBottom: '1px solid ' + LINE,
    whiteSpace: 'normal'
  };
  const sum = list.reduce((a, l) => ({

        flexWrap: 'wrap'

          padding: '8px 16px',
          borderRadius: 18,
          fontSize: 13,
          fontWeight: 700,

          <button onClick={() => setAll(true)} style={{
          padding: '8px 16px',
          borderRadius: 18,
          fontSize: 13,
          fontWeight: 700,
          background: all ? NAVY : '#F2F4F7',
          color: all ? '#fff' : '#4A5460'
        }}><BiText value={"\u5168\u5DE5\u7A0B"} /></button>
          <div style={{
          marginLeft: 'auto',
          display: 'flex',
          gap: 16,
          fontSize: 13,
          color: '#3A4552'
        }}>
            <span><BiText value={list.length} /><BiText value={" \u4EF6"} /></span><span><BiText value={sum.boxes} /> <BiText value={t('箱')} /></span>
            <span style={{
            fontWeight: 800,
            color: sum.diff >= 0 ? '#1B5E20' : '#B71C1C'
          }}><BiText value={(sum.diff >= 0 ? '+' : '−') + Math.abs(Math.round(sum.diff))} /> <BiText value={t('分')} /></span>
            <span style={{
            color: '#B71C1C'
          }}>⚠ <BiText value={sum.anom} /></span>
          </div>
        </div>
        <div style={{
        border: '1px solid ' + LINE,

        overflow: 'auto',

                ...th,
                width: 92,
                textAlign: 'center'
              }}><TH k="調整" /></th>

            <tbody>
              <BiText value={list.map((l, i) => {

                    <td style={td}><BiText value={l.doneBoxes || 0} /> / <BiText value={l.targetBoxes || 0} /><BiText value={l.fraction ? `（+${l.fraction}個）` : ''} /></td>
                    <td style={td}><BiText value={Math.round(l.actMin || 0)} /> <BiText value={t('分')} /></td>

                  color: '#B71C1C',

                  maxWidth: 240,

/* ══════════ アプリ本体 ══════════ */
function App() {
  const [lang, setLang] = useState(() => {
    try {
      return localStorage.getItem('outline-language') === 'id' ? 'id' : 'ja';
    } catch (e) {
      return 'ja';
    }
  });
  useEffect(() => {
    document.documentElement.lang = lang;
    try {
      localStorage.setItem('outline-language', lang);
    } catch (e) {}
  }, [lang]);
  const [user, setUser] = useState(undefined);
  const [ready, setReady] = useState(false);
  const [err, setErr] = useState(null);
  const [master, setMaster] = useState({});
  const [workers, setWorkers] = useState({});
  const [orders, setOrders] = useState({});
  const [procSettings, setProcSettings] = useState({});
  const [view, setView] = useState({
    name: 'proc'
  });
  const [scanHome, setScanHome] = useState(false);
  useEffect(() => auth.onAuthStateChanged((u) => {
    setUser(u);
    setReady(true);
  }), []);
  useEffect(() => {
    if (!user) return;
    return db.collection('outlineMaster').onSnapshot((s) => {
      const o = {};
      s.forEach((x) => o[x.id] = x.data());
      setMaster(o);
      setErr(null);
    }, (e) => setErr(e.message));
  }, [user]);
  useEffect(() => {
    if (!user) return;
    return db.collection('procSettings').onSnapshot((s) => {
      const o = {};
      s.forEach((x) => o[x.id] = x.data());
      setProcSettings(o);
    }, (e) => console.warn('procSettings:', e.message));
  }, [user]);
  useEffect(() => {
    if (!user) return;
    return db.collection('workers').onSnapshot((s) => {
      const o = {};
      s.forEach((x) => o[x.id] = {
        id: x.id,
        ...x.data()
      });
      setWorkers(o);
    }, (e) => console.warn('workers:', e.message));
  }, [user]);
  /* 作業指示：直近7日以降（未来日の計画も含む） ＋ 進行中（日付をまたいだ未完了分） */
  useEffect(() => {
    if (!user) return;
    const merge = (s, tag) => setOrders((prev) => {
      const o = {
        ...prev
      };
      Object.keys(o).forEach((k) => {
        if (o[k].__tag === tag) delete o[k];
      });
      s.forEach((x) => {
        o[x.id] = {
          id: x.id,
          ...x.data(),
          __tag: tag
        };
      });
      return o;
    });
    const u1 = db.collection('workOrders').where('date', '>=', daysAgoKey(7)).onSnapshot((s) => merge(s, 'recent'), (e) => console.warn('orders:', e.message));
    const u2 = db.collection('workOrders').where('status', 'in', ['running', 'paused']).onSnapshot((s) => merge(s, 'live'), (e) => console.warn('live:', e.message));
    return () => {
      u1();
      u2();
    };
  }, [user]);
  indexBi(master);
  const ctx = {
    lang,
    setLang,
    ...makeT(lang)
  };
  if (!ready) return <LangCtx.Provider value={ctx}><LoadingScreen /></LangCtx.Provider>;
  if (!user) return <LangCtx.Provider value={ctx}><div className="login-language"><LangUser /></div><LoginScreen /><BilingualDialog /></LangCtx.Provider>;

  /* QRガイド読取 → 品番解決 */
  function resolveScan(text) {
    const v = (text || '').trim();
    const keys = Object.keys(master);
    let hit = keys.find((h) => h === v) || keys.find((h) => {
      const q = master[h]?.qrText;
      return q && (q === v || q.includes(v) || v.includes(q));
    }) || keys.find((h) => v.includes(h));
    setScanHome(false);
    if (hit) setView((x) => ({
      name: 'info',
      proc: x.proc,
      hinban: hit
    }));else showBiDialog("alert", '該当する品番が見つかりません: ' + v.slice(0, 30));
  }
  let screen;
  if (err) screen = <ErrorScreen error={err} onRetry={() => window.location.reload()} />;else if (view.name === 'proc') screen = <ProcessSelect user={user} onPick={(p) => setView({
    name: 'work',
    proc: p
  })} onLogout={() => auth.signOut()} />;else if (view.name === 'search') screen = <SearchScreen master={master} proc={view.proc} user={user} onPick={(h) => setView({
    name: 'info',
    proc: view.proc,
    hinban: h
  })} onBack={() => setView({
    name: 'work',
    proc: view.proc
  })} onHome={() => setView({
    name: 'work',
    proc: view.proc
  })} />;else if (view.name === 'info') screen = <InfoViewer proc={view.proc} hinban={view.hinban} master={master} user={user} onBack={() => setView(view.backTo || {
    name: 'search',
    proc: view.proc
  })} onChangeProc={(p) => setView({
    ...view,
    proc: p
  })} />;else if (view.name === 'master') screen = <MasterAdmin master={master} workers={workers} user={user} onBack={() => setView({
    name: 'work',
    proc: view.proc
  })} />;else if (view.name === 'work') screen = <WorkPlanScreen proc={view.proc} master={master} workers={workers} orders={orders} settings={procSettings[view.proc.id]} user={user} onBack={() => setView({
    name: 'proc'
  })} onQR={() => setScanHome(true)} onSearch={() => setView({
    name: 'search',
    proc: view.proc
  })} onMaster={() => setView({
    name: 'master',
    proc: view.proc
  })} onLogout={() => auth.signOut()} onOpenSheet={async (o, w) => {
    if (o.kind === 'task') {
      try {
        await db.collection('workOrders').doc(o.id).update({
          status: 'running',
          startAt: Date.now(),
          workerId: w ? w.id : o.assignedWorkerId || null,
          workerName: w ? w.name : o.assignedWorkerName || ''
        });
        setView({
          name: 'workrun',
          proc: view.proc,
          logId: o.id
        });
      } catch (e) {
        showBiDialog("alert", '開始に失敗: ' + e.message);
      }
    } else setView({
      name: 'worksheet',
      proc: view.proc,
      orderId: o.id,
      worker: w
    });
  }} onResume={(o) => setView({
    name: 'workrun',
    proc: view.proc,
    logId: o.id
  })} onHistory={() => setView({
    name: 'workhist',
    proc: view.proc
  })} onPlanner={() => setView({
    name: 'planner',
    proc: view.proc
  })} onAnalytics={() => setView({
    name: 'analytics',
    proc: view.proc
  })} />;else if (view.name === 'planner') screen = <SchedulePlanner proc={view.proc} master={master} workers={workers} orders={orders} settings={procSettings[view.proc.id]} user={user} onBack={() => setView({
    name: 'work',
    proc: view.proc
  })} />;else if (view.name === 'worksheet') {
    const o = orders[view.orderId];
    screen = o ? <WorkSheetScreen proc={view.proc} order={o} worker={view.worker} master={master} user={user} onBack={() => setView({
      name: 'work',
      proc: view.proc
    })} onStart={(id) => setView({
      name: 'workrun',
      proc: view.proc,
      logId: id
    })} onInfo={(h) => setView({
      name: 'info',
      proc: view.proc,
      hinban: h,
      backTo: view
    })} /> : <LoadingScreen />;
  } else if (view.name === 'workrun') {
    const log = orders[view.logId];
    screen = log ? <WorkRunScreen proc={view.proc} log={log} master={master} orders={orders} user={user} onExit={() => setView({
      name: 'work',
      proc: view.proc
    })} onInfo={(h) => setView({
      name: 'info',
      proc: view.proc,
      hinban: h,
      backTo: view
    })} onDone={() => setView({
      name: 'work',
      proc: view.proc
    })} /> : <LoadingScreen />;
  } else if (view.name === 'workhist') screen = <WorkHistory proc={view.proc} logs={orders} user={user} onBack={() => setView({
    name: 'work',
    proc: view.proc
  })} />;else if (view.name === 'analytics') screen = <AnalyticsScreen proc={view.proc} master={master} workers={workers} user={user} onBack={() => setView({
    name: 'work',
    proc: view.proc
  })} />;
  return <LangCtx.Provider value={ctx}>
      <BiText value={screen} /><BilingualDialog />
      <BiText value={QR_ENABLED && scanHome && <QRScannerModal expectedValue="" label="ガイドQRを読み取ってください" onSuccess={resolveScan} onClose={() => setScanHome(false)} />} />
    </LangCtx.Provider>;
}

        setHighlight((i) => e.key === 'Home' ? 0 : e.key === 'End' ? options.length - 1 : Math.max(0, Math.min(options.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1))));

let biDialog = null;const biDialogQueue = [];

}

    <div style={{ display: 'flex', gap: 12, justifyContent: 'flex-end', marginTop: 24 }}>

    </div>

}
